name: AOTR update watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  repository_dispatch:
    types: [check_updates]
  workflow_dispatch:
    inputs:
      preview:
        description: "Post a sample alert to Discord (saves nothing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for AOTR place updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREVIEW: ${{ github.event.inputs.preview }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python3 aotr_update_watcher.py --preview
          else
            python3 aotr_update_watcher.py --once
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aotr_state.json
          git diff --staged --quiet || git commit -m "chore: update AOTR place state [skip ci]"
          git push
