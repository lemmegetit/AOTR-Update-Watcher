name: AOTR update watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 10 minutes (GitHub's minimum is 5)
  workflow_dispatch:          # lets you start it by hand from the Actions tab
    inputs:
      preview:
        description: "Post a sample alert to Discord (saves nothing)"
        type: boolean
        default: false

permissions:
  contents: write             # needed to save aotr_state.json back to the repo

concurrency:
  group: aotr-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for AOTR place updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python3 aotr_update_watcher.py --preview
          else
            python3 aotr_update_watcher.py --once
          fi

      - name: Remember the latest updates
        run: |
          git config user.name "aotr-watcher"
          git config user.email "aotr-watcher@users.noreply.github.com"
          git add aotr_state.json
          git diff --staged --quiet || (git commit -m "Update state" && git pull --rebase && git push)
