name: AOTR update watcher

on:
  schedule:
    - cron: "*/30 * * * *"    # fallback; cron-job.org triggers the frequent checks
  repository_dispatch:         # lets cron-job.org start a check
    types: [check_updates]
  workflow_dispatch:           # lets you start it by hand from the Actions tab
    inputs:
      preview:
        description: "Post a sample of every alert to Discord (saves nothing)"
        type: boolean
        default: false

permissions:
  contents: write              # needed to save aotr_state.json back to the repo

concurrency:
  group: aotr-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check AOTR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING: ${{ secrets.DISCORD_PING }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview || 'false' }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python3 aotr_update_watcher.py --preview
          else
            python3 aotr_update_watcher.py --once
          fi

      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "aotr-watcher"
          git config user.email "aotr-watcher@users.noreply.github.com"
          git add aotr_state.json
          git diff --staged --quiet || (git commit -m "Update state" && git pull --rebase && git push)
