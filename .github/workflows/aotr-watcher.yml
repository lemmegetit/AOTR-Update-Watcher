name: AOTR update watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub's minimum is 5)
  workflow_dispatch:          # lets you start it by hand from the Actions tab

permissions:
  contents: write             # needed to save aotr_state.json back to the repo

concurrency:
  group: aotr-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for an AOTR update
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 aotr_update_watcher.py --once

      - name: Remember the latest update
        run: |
          git config user.name "aotr-watcher"
          git config user.email "aotr-watcher@users.noreply.github.com"
          git add aotr_state.json
          git diff --staged --quiet || (git commit -m "Update state" && git push)
