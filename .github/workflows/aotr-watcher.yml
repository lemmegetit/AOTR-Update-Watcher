name: AOTR update watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # backup fallback schedule
  repository_dispatch:        # allows cron-job.org to trigger this workflow instantly
    types: [check_updates]
  workflow_dispatch:          # manual trigger button
    inputs:
      preview:
        description: "Post a sample alert to Discord (saves nothing)"
        type: boolean
        default: false

permissions:
  contents: write             # needed to save state and keepalive files back to the repo

concurrency:
  group: aotr-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for AOTR place updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview || 'false' }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python3 aotr_update_watcher.py --preview
          else
            python3 aotr_update_watcher.py --once
          fi

      - name: Remember the latest updates
        run: |
          git config user.name "aotr-watcher"
          git config user.email "aotr-watcher@users.noreply.github.com"
          git add aotr_state.json
          git diff --staged --quiet || (git commit -m "Update state" && git pull --rebase && git push)

  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file
        run: |
          mkdir -p .github
          date -u > .github/keepalive.txt
          git config user.name "aotr-watcher"
          git config user.email "aotr-watcher@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --staged --quiet || (git commit -m "Automated keepalive ping" && git push)
